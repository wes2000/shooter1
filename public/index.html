<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    canvas { display: block; cursor: crosshair; }

    .screen {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.active { display: flex; }

    /* Start Screen */
    #startScreen {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #startScreen h1 {
      font-size: 64px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71, #3498db, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 18px; color: #888; margin-bottom: 40px; }
    input[type="text"] {
      width: 280px;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #151530;
      color: #eee;
      margin-bottom: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #3498db; }
    .btn-row { display: flex; gap: 12px; margin-top: 8px; }

    .btn {
      padding: 12px 32px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-green { background: #2ecc71; color: #fff; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-gray { background: #555; color: #fff; }
    .btn-yellow { background: #f39c12; color: #fff; }

    /* Join Screen */
    #joinScreen {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #joinScreen h2 { margin-bottom: 20px; font-size: 32px; }
    #codeInput {
      width: 200px;
      font-size: 28px;
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .back-link {
      margin-top: 20px;
      color: #888;
      cursor: pointer;
      font-size: 14px;
    }
    .back-link:hover { color: #ccc; }

    /* Room Screen */
    #roomScreen {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #roomScreen h2 { margin-bottom: 4px; }
    .room-code {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 10px;
      color: #f39c12;
      margin: 8px 0 4px;
      font-family: monospace;
    }
    .room-hint { color: #666; font-size: 13px; margin-bottom: 20px; }
    .player-list {
      width: 360px;
      background: #151530;
      border-radius: 8px;
      border: 1px solid #333;
      margin-bottom: 20px;
      max-height: 280px;
      overflow-y: auto;
    }
    .player-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #222;
    }
    .player-entry:last-child { border-bottom: none; }
    .player-entry .pname { font-weight: 500; }
    .player-entry .host-tag { color: #f39c12; font-size: 12px; margin-left: 8px; }
    .player-entry .ready-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
    .player-entry .ready-tag.yes { background: #2ecc71; color: #fff; }
    .player-entry .ready-tag.no { background: #555; color: #aaa; }
    .lobby-buttons { display: flex; gap: 12px; }

    /* Status Messages */
    .status-msg {
      color: #888;
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
    }
    .status-msg.error { color: #e74c3c; }

    /* Game HUD */
    #gameScreen { background: #000; }
    #gameCanvas { position: absolute; top: 0; left: 0; }
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #scoreboard {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      min-width: 160px;
    }
    .sb-header { font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .sb-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .sb-row .sb-name { margin-right: 16px; }
    .sb-row .sb-kd { color: #aaa; }
    #healthBar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }
    #healthFill { height: 100%; background: #2ecc71; transition: width 0.15s; border-radius: 6px; }
    #deathOverlay {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-shadow: 0 0 20px rgba(231,76,60,0.5);
    }
    #leaveBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      pointer-events: all;
      padding: 6px 14px;
      font-size: 12px;
      opacity: 0.6;
    }
    #leaveBtn:hover { opacity: 1; }
    #minimap {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 140px;
      height: 140px;
      border: 1px solid #444;
      border-radius: 4px;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="startScreen" class="screen active">
    <h1>SHOOTER</h1>
    <div class="subtitle">Multiplayer 2D Arena</div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="16" />
    <div class="btn-row">
      <button class="btn btn-green" id="createBtn">Create Game</button>
      <button class="btn btn-primary" id="joinBtn">Join Game</button>
    </div>
  </div>

  <!-- Join Screen -->
  <div id="joinScreen" class="screen">
    <h2>Join Game</h2>
    <input type="text" id="codeInput" placeholder="CODE" maxlength="4" />
    <button class="btn btn-primary" id="connectBtn">Connect</button>
    <div class="status-msg" id="joinStatus"></div>
    <div class="back-link" id="joinBack">Back</div>
  </div>

  <!-- Room Screen -->
  <div id="roomScreen" class="screen">
    <h2>Game Lobby</h2>
    <div class="room-code" id="roomCode">----</div>
    <div class="room-hint">Share this code with friends</div>
    <div class="player-list" id="playerList"></div>
    <div class="lobby-buttons">
      <button class="btn btn-yellow" id="readyBtn">Ready</button>
      <button class="btn btn-green" id="startGameBtn" style="display:none">Start Game</button>
      <button class="btn btn-gray" id="leaveLobbyBtn">Leave</button>
    </div>
    <div class="status-msg" id="roomStatus"></div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <button class="btn btn-gray" id="leaveBtn">Leave</button>
      <div id="scoreboard"></div>
      <canvas id="minimap"></canvas>
      <div id="healthBar"><div id="healthFill"></div></div>
      <div id="deathOverlay">YOU DIED — respawning...</div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
