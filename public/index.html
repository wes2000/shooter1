<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      color: #eee;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }

    /* Screens */
    .screen {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.active { display: flex; }

    /* Start Screen */
    #startScreen {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #startScreen h1 {
      font-size: 64px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71, #3498db, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    #startScreen .subtitle {
      font-size: 18px;
      color: #888;
      margin-bottom: 40px;
    }
    #startScreen input {
      width: 280px;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #151530;
      color: #eee;
      margin-bottom: 20px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    #startScreen input:focus { border-color: #3498db; }

    .btn {
      padding: 12px 32px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #3498db; color: #fff; }
    .btn-green { background: #2ecc71; color: #fff; }
    .btn-red { background: #e74c3c; color: #fff; }
    .btn-gray { background: #555; color: #fff; }
    .btn-yellow { background: #f39c12; color: #fff; }

    /* Lobby Browser */
    #lobbyBrowser {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #lobbyBrowser h2 { margin-bottom: 20px; font-size: 32px; }
    .lobby-actions { display: flex; gap: 12px; margin-bottom: 20px; }
    .lobby-actions input {
      padding: 10px 14px;
      font-size: 14px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #151530;
      color: #eee;
      outline: none;
      width: 200px;
    }
    .lobby-actions input:focus { border-color: #3498db; }
    #lobbyListContainer {
      width: 400px;
      max-height: 300px;
      overflow-y: auto;
      background: #151530;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .lobby-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lobby-item:hover { background: #1e1e40; }
    .lobby-item:last-child { border-bottom: none; }
    .lobby-item .info { display: flex; flex-direction: column; }
    .lobby-item .info .name { font-weight: 600; }
    .lobby-item .info .count { font-size: 12px; color: #888; }
    .lobby-item .join-btn { padding: 6px 16px; font-size: 13px; }
    .no-lobbies { padding: 30px; text-align: center; color: #666; }
    .back-link {
      margin-top: 20px;
      color: #888;
      cursor: pointer;
      font-size: 14px;
    }
    .back-link:hover { color: #ccc; }

    /* Lobby Room */
    #lobbyRoom {
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a3e 100%);
    }
    #lobbyRoom h2 { margin-bottom: 4px; }
    #lobbyRoom .room-id { color: #666; font-size: 13px; margin-bottom: 20px; }
    .player-list {
      width: 360px;
      background: #151530;
      border-radius: 8px;
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .player-entry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #222;
    }
    .player-entry:last-child { border-bottom: none; }
    .player-entry .pname { font-weight: 500; }
    .player-entry .host-tag { color: #f39c12; font-size: 12px; margin-left: 8px; }
    .player-entry .ready-tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
    .player-entry .ready-tag.yes { background: #2ecc71; color: #fff; }
    .player-entry .ready-tag.no { background: #555; color: #aaa; }
    .lobby-buttons { display: flex; gap: 12px; }

    /* Game HUD */
    #gameScreen { background: #000; }
    #gameCanvas { position: absolute; top: 0; left: 0; }
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #scoreboard {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      min-width: 160px;
    }
    #scoreboard .sb-header { font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    #scoreboard .sb-row { display: flex; justify-content: space-between; padding: 2px 0; }
    #scoreboard .sb-row .sb-name { margin-right: 16px; }
    #scoreboard .sb-row .sb-kd { color: #aaa; }
    #healthBar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }
    #healthFill { height: 100%; background: #2ecc71; transition: width 0.15s; border-radius: 6px; }
    #deathOverlay {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 700;
      color: #e74c3c;
      text-shadow: 0 0 20px rgba(231,76,60,0.5);
    }
    #leaveBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      pointer-events: all;
      padding: 6px 14px;
      font-size: 12px;
      opacity: 0.6;
    }
    #leaveBtn:hover { opacity: 1; }

    /* Minimap */
    #minimap {
      position: absolute;
      bottom: 50px;
      right: 10px;
      width: 140px;
      height: 140px;
      border: 1px solid #444;
      border-radius: 4px;
      background: rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="startScreen" class="screen active">
    <h1>SHOOTER</h1>
    <div class="subtitle">Multiplayer 2D Arena</div>
    <input type="text" id="nameInput" placeholder="Enter your name" maxlength="16" />
    <button class="btn btn-primary" id="playBtn">PLAY</button>
  </div>

  <!-- Lobby Browser -->
  <div id="lobbyBrowser" class="screen">
    <h2>Lobbies</h2>
    <div class="lobby-actions">
      <input type="text" id="lobbyNameInput" placeholder="New lobby name" maxlength="24" />
      <button class="btn btn-green" id="createLobbyBtn">Create</button>
    </div>
    <div id="lobbyListContainer">
      <div class="no-lobbies">No lobbies yet. Create one!</div>
    </div>
    <div class="back-link" id="backToStart">Back</div>
  </div>

  <!-- Lobby Room -->
  <div id="lobbyRoom" class="screen">
    <h2 id="roomName">Lobby</h2>
    <div class="room-id" id="roomId"></div>
    <div class="player-list" id="playerList"></div>
    <div class="lobby-buttons">
      <button class="btn btn-yellow" id="readyBtn">Ready</button>
      <button class="btn btn-green" id="startGameBtn" style="display:none">Start Game</button>
      <button class="btn btn-gray" id="leaveLobbyBtn">Leave</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <button class="btn btn-gray" id="leaveBtn">Leave</button>
      <div id="scoreboard"></div>
      <canvas id="minimap"></canvas>
      <div id="healthBar"><div id="healthFill"></div></div>
      <div id="deathOverlay">YOU DIED — respawning...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
